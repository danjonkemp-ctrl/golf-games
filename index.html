<title>Golf Games. Play, compete, good times.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0B0D0E; --slate:#2B2F33; --stone:#6B6F72; --lime:#B7FF3B; --bone:#F2F2EA; --accent:#FF5A3D;
  --card:#121517; --card2:#1A1E21; --line:rgba(242,242,234,.08); --glass:rgba(11,13,14,.86);
  --pixel:"Silkscreen","Courier New",monospace;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--midnight)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--midnight);color:var(--bone);font:14px/1.5 var(--mono);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
svg.px,canvas.px{shape-rendering:crispEdges;image-rendering:pixelated;display:block}
.cap{font:700 10.5px/1.2 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--stone)}
.lime{color:var(--lime)} .dim{color:var(--stone)}
.h{font-family:var(--pixel);font-weight:700;letter-spacing:.02em}

/* top bar and nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 6px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.top .mid{text-align:center;line-height:1.15;min-width:0}
.top .mid b{display:block;font:700 17px var(--pixel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mid span{font-size:11px;color:var(--stone)}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.ib.logo svg{width:30px;height:29px}
.top .r{justify-self:end}
.dot{width:9px;height:9px;background:var(--stone)}
.dot.live{background:var(--lime);animation:blink 2.4s steps(2) infinite}
.dot.pending{background:var(--bone)} .dot.offline,.dot.local{background:var(--accent)}
@keyframes blink{50%{opacity:.35}}
main{max-width:540px;margin:0 auto;padding:0 16px 230px;min-height:100vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px env(safe-area-inset-bottom,0px);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0 8px;font:700 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stone);transition:color .2s;text-align:center}
.nav svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.nav button[aria-selected="true"]{color:var(--lime)}
.nav button[aria-selected="true"] svg{transform:translateY(-2px) scale(1.12)}
.nav button.off{opacity:.35}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:10px;font:700 13px var(--mono);letter-spacing:.16em;text-transform:uppercase;transition:transform .25s var(--spring),opacity .2s,background .2s;text-align:center}
.btn:not(:disabled):active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn.go{background:var(--lime);color:var(--midnight);box-shadow:0 10px 30px -14px rgba(183,255,59,.7)}
.btn.line{border:1.5px solid rgba(242,242,234,.35);color:var(--bone)}
.btn.warn{border:1.5px solid rgba(255,90,61,.5);color:var(--accent)}
.btn:disabled{opacity:.3}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;background:var(--lime);color:var(--midnight);font:700 11px var(--mono);white-space:nowrap}
.chip.ghost{background:var(--card2);color:var(--stone)}
.chip.acc{background:var(--accent);color:var(--midnight)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{height:44px;border-radius:9px;background:var(--card2);font:700 12px var(--mono);letter-spacing:.06em;color:var(--stone);text-align:center;transition:background .2s,color .2s,transform .2s var(--spring)}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--midnight)}
.seg button:active{transform:scale(.95)}

/* intro */
.intro{position:fixed;inset:0;z-index:80;background:var(--midnight);overflow:hidden}
.intro canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:56%;image-rendering:pixelated}
.intro .brand{position:relative;margin-top:calc(env(safe-area-inset-top,0px) + 11vh);display:flex;flex-direction:column;align-items:center}
.intro .logo{width:128px;height:123px}
.intro .word{width:min(300px,78vw);height:auto;margin-top:24px}
.intro .tagl{margin-top:16px;color:var(--bone)}
.intro .acts{position:absolute;left:22px;right:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:440px;margin:0 auto}
.intro.out{animation:introOut .5s var(--ease) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}

/* home */
.hero{position:relative;margin:0 -16px;height:200px;overflow:hidden}
.hero canvas{width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:60px;background:linear-gradient(transparent,var(--midnight))}
.hero .say{position:absolute;left:18px;top:16px;z-index:2;font:700 11px/1.7 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 0 #000}
.hero .say i{display:block;width:22px;height:3px;background:var(--lime);margin-top:8px}
.live{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--lime);background:rgba(183,255,59,.08);margin:6px 0 4px}
.live .ic{width:38px;height:38px;flex:none}
.live b{display:block;font:700 14px var(--pixel)}
.live small{display:block;color:var(--stone);font-size:12px}
.live .go{margin-left:auto;width:16px;height:16px}
.glist{margin:14px 0 0;border-top:1px solid var(--line)}
.grow{display:flex;align-items:center;gap:14px;width:100%;height:56px;padding:0 12px;border-bottom:1px solid var(--line);font:700 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:background .15s,transform .2s var(--spring)}
.grow .ic{width:24px;height:24px;flex:none}
.grow .go{margin-left:auto;width:12px;height:12px;color:var(--stone)}
.grow.hot{background:var(--lime);color:var(--midnight);border-radius:8px;border-bottom-color:transparent}
.grow.hot .go{color:var(--midnight)}
.grow:active{transform:scale(.98)}
.sect{margin:30px 0 10px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.hist .ic{width:22px;height:22px;flex:none}
.hist b{display:block;font-size:13px}
.hist small{display:block;color:var(--stone);font-size:11.5px}
.hist .w{margin-left:auto;text-align:right;font-size:12px;color:var(--lime)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:center;padding-bottom:12px}
.gcard canvas{width:100%;height:70px}
.gcard .ic{width:44px;height:44px;margin:-26px auto 6px;position:relative}
.gcard b{display:block;font:700 13px var(--pixel)}
.gcard small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-top:4px;padding:0 8px}

/* setup */
.ghead{display:flex;gap:14px;align-items:center;margin:16px 0 6px}
.ghead .ic{width:64px;height:64px;flex:none}
.ghead h1{margin:0;font:700 26px/1 var(--pixel)}
.ghead p{margin:6px 0 0;color:var(--stone);font-size:12.5px}
.rules{font-size:12.5px;color:var(--stone);line-height:1.6;margin:6px 0 0;padding:12px 14px;border-radius:10px;background:var(--card)}
.rules b{color:var(--bone)}
.lab{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px;font:700 10.5px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
.lab span{color:var(--stone);letter-spacing:.06em;text-transform:none;font-weight:500}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);transition:border-color .2s,background .2s}
.prow.on{border-color:var(--lime);background:rgba(183,255,59,.07)}
.prow .nm{flex:1;font-weight:700}
.prow .nm small{display:block;font-weight:500;color:var(--stone);font-size:11.5px}
.prow .ord{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:700 12px var(--mono);background:var(--card2);color:var(--stone)}
.prow.on .ord{background:var(--lime);color:var(--midnight)}
.prow .ed{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--stone)}
.prow .ed svg{width:14px;height:14px}
.sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.side{padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:700;font-size:12.5px}
.side small{display:block;color:var(--stone);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.vs{font:700 12px var(--pixel);color:var(--accent)}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.crow canvas{width:64px;height:40px;border-radius:6px;flex:none}
.crow b{display:block;font-size:14px}
.crow small{display:block;color:var(--stone);font-size:11.5px}
.crow .go{margin-left:auto;width:12px;height:12px;color:var(--stone)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt>span{font-weight:700;font-size:13px}
.opt>span small{display:block;font-weight:500;color:var(--stone);font-size:11.5px}
.num{display:flex;align-items:center;gap:4px}
.num button{width:36px;height:36px;border-radius:8px;background:var(--card2);display:grid;place-items:center}
.num button svg{width:11px;height:11px}
.num output{min-width:40px;text-align:center;font:800 17px var(--mono)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:7px;background:var(--slate);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:4px;background:var(--bone);transition:transform .3s var(--spring)}
.sw:checked{background:var(--lime)} .sw:checked::after{transform:translateX(22px);background:var(--midnight)}
.clubs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.clubs button{height:32px;padding:0 10px;border-radius:7px;background:var(--card2);font:700 11px var(--mono);color:var(--stone)}
.clubs button[aria-pressed="true"]{background:var(--lime);color:var(--midnight)}
.why{color:var(--accent);font-size:12px;text-align:center;margin:10px 0 0}
.startbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:24;padding:10px 16px;background:linear-gradient(transparent,var(--midnight) 30%)}
.startbar>div{max-width:508px;margin:0 auto}

/* play */
.map{position:relative;margin:0 -16px;height:196px;overflow:hidden}
.map canvas{width:100%;height:100%}
.map::after{content:"";position:absolute;inset:auto 0 0;height:64px;background:linear-gradient(transparent,var(--midnight))}
.map .yd{position:absolute;left:16px;top:12px;z-index:2;display:flex;gap:6px}
.track{display:flex;gap:5px;overflow-x:auto;margin:-20px -16px 14px;padding:4px 16px 4px;position:relative;z-index:3;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track button{flex:none;width:36px;height:34px;border-radius:7px;background:var(--card2);font:700 12px var(--mono);color:var(--stone);text-align:center;transition:transform .3s var(--spring),background .2s,color .2s}
.track button.done{color:var(--lime);background:#1d2a12}
.track button.cur{background:var(--lime);color:var(--midnight);transform:translateY(-3px)}
.strip{display:flex;gap:4px;justify-content:space-between;margin-bottom:12px}
.strip>div{flex:1;text-align:center;min-width:0}
.strip .av{margin:0 auto 4px}
.strip b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span{display:block;font:800 13px var(--mono)}
.strip .top1 span{color:var(--lime)}
.panel{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.dec{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.dec .ic{width:56px;height:54px;flex:none}
.dec b{display:block;font:700 15px var(--pixel);color:var(--lime)}
.dec p{margin:3px 0 0;font-size:12px;color:var(--bone)}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;font-size:12.5px}
.banner .ic{width:26px;height:26px;flex:none}
.banner b{color:var(--lime)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px}
.pk{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;border-radius:10px;background:var(--card2);font-size:11px;font-weight:700;text-align:center;transition:transform .3s var(--spring),background .2s,box-shadow .2s}
.pk small{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:700}
.pk[aria-pressed="true"]{background:rgba(183,255,59,.12);box-shadow:inset 0 0 0 1.5px var(--lime)}
.pk.wolfme{background:rgba(183,255,59,.06);box-shadow:inset 0 0 0 1px rgba(183,255,59,.3)}
.pk.wolfme small{color:var(--lime)}
.pk:active{transform:scale(.93)}
.alone{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.alone button{height:46px;border-radius:9px;border:1.5px solid rgba(242,242,234,.22);font:700 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-align:center;transition:background .2s,color .2s,border-color .2s,transform .2s var(--spring)}
.alone button[aria-pressed="true"]{background:var(--lime);color:var(--midnight);border-color:var(--lime)}
.alone button:active{transform:scale(.95)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow .who{flex:1;min-width:0}

                defaults:{ partnerWin:2, oppWin:3, loneWin:4, loneLoss:1, blindWin:6, blindLoss:2, lastPlaceWolf:true } },

function roundShots(r, hcp){
  if (!r.useHcp) return 0;
  const h = Math.max(0, Math.round(+hcp||0));

function matchFrom(diffs, n, stopWhenDecided){
  // diffs: array (length n) of +1 side A won, -1 side B won, 0 halved, null not played

function wolfOrderFor(r, i, totalsBefore){
  const n = r.holes.length, P = r.players.length, rr = res(r,i);

    let min = Infinity, pick = 0;
    for (let p=0;p<P;p++) if (totalsBefore[p] <= min){ min = totalsBefore[p]; pick = p; }

  const S = r.settings, P = r.players.length;

    const won = Array(P).fill(0); let carry = 0;
    r.holes.forEach((hole,i)=>{ const h=res(r,i); if(!h) return;
      const net = h.s.map((s,p)=>netOf(r,p,i,s)), best = Math.min(...net), who = net.map((v,p)=>v===best?p:-1).filter(p=>p>=0);
      if (who.length===1){ const k = 1+carry; won[who[0]]+=k; perHole[i].pts[who[0]]=k; perHole[i].note = `${pname(r,who[0])} takes ${k} skin${k>1?"s":""}`; carry=0; }
      else { if (r.settings.carry){ carry++; perHole[i].note = `Tied, ${carry} skin${carry>1?"s":""} carry`; } else perHole[i].note = "Tied, no skin"; }
    });
    const val = +r.settings.value||0;
    rows = [...Array(P).keys()].map(p=>({players:[p], value:won[p], text:String(won[p]), sub: val?`$${won[p]*val}`:`${gross[p]} strokes`, tie:netT[p]}));
    rows.sort((a,b)=>b.value-a.value || a.tie-b.tie);
    unit = "skins"; status = carry ? `${carry} skin${carry>1?"s":""} carrying over` : "";
  }
  else if (g==="stableford" || g==="three"){
    if (g==="stableford"){
      const t = Array(P).fill(0);
      r.holes.forEach((hole,i)=>{ const h=res(r,i); if(!h) return;
        h.s.forEach((s,p)=>{ const v = Math.max(0, 2 + (+hole.par) - netOf(r,p,i,s)); t[p]+=v; perHole[i].pts[p]=v; }); });
      rows = [...Array(P).keys()].map(p=>({players:[p], value:t[p], text:String(t[p]), sub:`${gross[p]} strokes`, tie:-gross[p]}));
      rows.sort((a,b)=>b.value-a.value || b.tie-a.tie);
    } else {
      higherBetter = false; unit = "net";
      r.holes.forEach((hole,i)=>{ const h=res(r,i); if(!h) return; h.s.forEach((s,p)=>perHole[i].pts[p]=netOf(r,p,i,s)-(+hole.par)); });
      rows = [...Array(P).keys()].map(p=>{ const d = netT[p]-parT[p]; return {players:[p], value:netT[p], text: pl? (d===0?"E":d>0?"+"+d:String(d)) : "E", sub:`${gross[p]} gross, ${netT[p]} net`, tie:gross[p]}; });
      rows.sort((a,b)=>(a.value-parT[a.players[0]])-(b.value-parT[b.players[0]]) || a.tie-b.tie);
    }
  }
  else if (g==="bbb"){
    const t = Array(P).fill(0);
    r.holes.forEach((hole,i)=>{ const h=res(r,i); if(!h||!h.b) return;
      h.b.forEach(p=>{ if(p!=null && p>=0){ t[p]++; perHole[i].pts[p]++; } });
      perHole[i].note = ["Bingo","Bango","Bongo"].map((k,j)=>h.b[j]>=0&&h.b[j]!=null?`${k}: ${pname(r,h.b[j])}`:null).filter(Boolean).join(", ");
    });
    rows = [...Array(P).keys()].map(p=>({players:[p], value:t[p], text:String(t[p]), sub:"", tie:0}));
    rows.sort((a,b)=>b.value-a.value);
  }
  else if (g==="match" || g==="alt" || g==="nassau"){
    const [A,B] = sides(r);
    const diffs = r.holes.map((hole,i)=>{ const h=res(r,i); if(!h) return null;
      let a,b;
      if (g==="alt"){ if(!h.t) return null; a = h.t[0]-shotsOn(r,teamShots(r,A),i); b = h.t[1]-shotsOn(r,teamShots(r,B),i); }
      else { a = Math.min(...A.map(p=>netOf(r,p,i,h.s[p]))); b = Math.min(...B.map(p=>netOf(r,p,i,h.s[p]))); }
      const d = a<b?1:b<a?-1:0;
      perHole[i].side = d; perHole[i].note = d===0?`Halved`:`${sideName(r,d>0?A:B)} win the hole`;
      (d>0?A:d<0?B:[]).forEach(p=>perHole[i].pts[p]=1);
      return d; });
    if (g!=="nassau"){
      const m = matchFrom(diffs, n, true);
      status = matchText(r, m, n, A, B);
      const lead = m.up>0?0:m.up<0?1:-1;
      rows = [A,B].map((s,k)=>({players:s, side:k, value: k===0?m.up:-m.up, text: m.up===0?"AS": (k===lead? `${Math.abs(m.up)} UP` : "") , sub: k===lead? status : "", tie:0}));
      rows.sort((a,b)=>b.value-a.value);
      unit = "match";
      const decided = m.decidedAt>=0;
      return finish({rows, perHole, status, unit, higherBetter, decided, diffs});
    } else {
      const half = n>=18 ? 9 : Math.floor(n/2);
      const segs = [["Front", 0, half], ["Back", half, n], ["Overall", 0, n]];
      const stake = +r.settings.stake||0, units=[0,0];
      const bets = segs.map(([label,a,b])=>{
        const sub = diffs.slice(a,b), m = matchFrom(sub, b-a, false), done = sub.every(x=>x!=null);
        let text = m.last<0 ? "Not started" : m.up===0 ? "All square" : `${sideName(r,m.up>0?A:B)} ${Math.abs(m.up)} up`;
        let win = -1; if (done && m.up!==0){ win = m.up>0?0:1; units[win]++; units[1-win]--; text = `${sideName(r,m.up>0?A:B)} won ${Math.abs(m.up)} up`; }
        else if (done) text = "Halved";
        return {label:`${label} (${a+1} to ${b})`, text, win, done};
      });
      rows = [A,B].map((s,k)=>({players:s, side:k, value:units[k], text: (units[k]>0?"+":"")+(stake? `$${units[k]*stake}` : units[k]), sub: bets.filter(b=>b.win===k).map(b=>b.label.split(" ")[0]).join(", "), tie:0}));
      rows.sort((a,b)=>b.value-a.value);
      unit = stake ? "$" : "bets";
      status = bets.map(b=>`${b.label.split(" (")[0]}: ${b.text}`).join(". ");
      return finish({rows, perHole, status, unit, higherBetter, bets, diffs});
    }
  }
  return finish({rows, perHole, status, unit, higherBetter});

  function finish(o){
    o.played = pl; o.total = n;
    o.done = pl === n || !!o.decided;
    // winners: players on top row(s) when there is a clear leader
    const top = o.rows[0], tied = o.rows.filter(x=>x.value===top.value && (o.unit==="match"||x.tie===top.tie));
    o.winners = (o.unit==="match" && top.value===0) ? [] : (tied.length===o.rows.length && o.rows.length>1 ? [] : tied.flatMap(x=>x.players));
    o.gross = gross; o.net = netT;
    return o;
  }
}

/* ---------- storage: local (this phone) or cloud (Firebase) ---------- */
function LocalStore(){
  const ch = "BroadcastChannel" in window ? new BroadcastChannel("gg-sync") : null;
  const subs = {};
  const read = k => { try { return JSON.parse(localStorage.getItem("gg:"+k)); } catch(e) { return null; } };
  const write = (k,v) => { try { localStorage.setItem("gg:"+k, JSON.stringify(v)); } catch(e) {} };
  const fire = k => (subs[k]||[]).forEach(f => setTimeout(() => f(read(k), { fromCache:false, pending:false }), 0));
  if (ch) ch.onmessage = e => { fire(e.data); if (String(e.data).startsWith("round:")) fire("history"); };
  const watch = (k, f) => { (subs[k] = subs[k]||[]).push(f); setTimeout(() => f(read(k), { fromCache:false }), 0); return () => { subs[k] = (subs[k]||[]).filter(x => x!==f); }; };
  const doSave = (k, p, rep) => {
    write(k, rep ? clone(p) : merge(read(k)||{}, clone(p)));

const nextHole = () => { const i = round.holes.findIndex((h,j) => !round.results[String(j)]); return i<0 ? round.holes.length-1 : i; };
const teeOrder = w => { const P = round.players.length; return [...Array(P).keys()].map(j => (w+j)%P); };
function syncPlay(){
  if (!live()) return;
  const r = round, i = ui.view, h = r.holes[i], d = holeDraft(i), saved = !!r.results[String(i)];
  if (r.game==="wolf"){
    $$("[data-a=partner]").forEach(b => b.setAttribute("aria-pressed", d.mode==="partner" && d.partner===+b.dataset.v));
    $$("[data-a=lone]").forEach(b => b.setAttribute("aria-pressed", d.mode===b.dataset.v));
  }
  if (r.game==="bbb") $$("[data-a=bbb]").forEach(b => { const [j,p] = b.dataset.v.split("|").map(Number); b.setAttribute("aria-pressed", d.b[j]===p); });
  const team = r.game==="wolf" ? (d.mode==="partner" ? [d.wolf,d.partner] : [d.wolf]) : [];
  $$(".srow[data-p]").forEach(row => {
    const p = +row.dataset.p, g = d.s[p], diff = g - h.par, tg = row.querySelector(".tag");
    if (r.game==="wolf"){
      if (p===d.wolf){ tg.textContent = d.mode==="lone"?"Lone wolf":d.mode==="blind"?"Blind wolf":"Wolf"; tg.className = "tag w"; }
      else if (team.includes(p)){ tg.textContent = "Partner"; tg.className = "tag p"; }
      else { tg.textContent = d.mode ? "Hunter" : ""; tg.className = "tag"; }
    }
    const sv = row.querySelector(".sv"); sv.className = "sv" + (diff<0?" under":diff>=2?" over2":"");
    sv.querySelector("b").textContent = g; sv.querySelector("span").textContent = relLabel(diff);
  });
  $$(".srow[data-t]").forEach(row => { const k = +row.dataset.t, g = d.t[k], diff = g - h.par, sv = row.querySelector(".sv"); sv.className = "sv"+(diff<0?" under":""); sv.querySelector("b").textContent = g; sv.querySelector("span").textContent = relLabel(diff); });
  // verdict
  const ok = ready(i, d); let v = "";
  if (!ok) v = `<b>Who’s with the wolf?</b>Pick a partner or go alone`;
  else {
    const ph = ENGINE.previewHole(r, i, d);
    if (r.game==="stableford") v = `<b>${r.players.map((p,k)=>`${esc(p.name)} ${ph.pts[k]}`).join(", ")}</b>Stableford points`;
    else if (r.game==="three") v = `<b>${r.players.map((p,k)=>`${esc(p.name)} ${ph.pts[k]===0?"E":ph.pts[k]>0?"+"+ph.pts[k]:ph.pts[k]}`).join(", ")}</b>Net to par on this hole`;
    else if (r.game==="bbb") v = `<b>${esc(ph.note || "No points yet")}</b>Tap who won each one`;
    else { const pts = ph.pts.map((x,k)=>x?`${esc(ENGINE.pname(r,k))} +${x}`:null).filter(Boolean); v = `<b>${esc(ph.note)}</b>${r.game==="wolf"||r.game==="skins"?(pts.join(", ")||"No points"):"Best net score wins the hole"}`; }
  }
  $("#verdict").innerHTML = v;
  const s = $("#save"); s.disabled = !ok; s.textContent = saved ? "Update" : "Save";
}

async function saveHole(){
  const r = round, i = ui.view, k = String(i), d = holeDraft(i), h = r.holes[i];
  const prev = r.results[k] ? clone(r.results[k]) : null;
  const res = r.game==="alt" ? { t:d.t.slice() } : r.game==="bbb" ? { b:d.b.slice() } : r.game==="wolf" ? { s:d.s.slice(), wolf:d.wolf, mode:d.mode, partner:d.mode==="partner"?d.partner:null } : { s:d.s.slice() };
  haptic();
  const before = ENGINE.compute(r).done;
  r.results[k] = res; delete drafts[k];
  const msg = `${myName()} saved hole ${h.n}`;
  r.updatedAt = Date.now();
  store.saveRound(r.id, { results:{ [k]:res }, updatedAt:r.updatedAt, lastBy:device, lastMsg:msg });
  const s = $("#save"); s.innerHTML = ic("tick");
  const ph = ENGINE.compute(r).perHole[i];
  ph.pts.forEach((v,p) => { if (!v || r.game==="three") return; const el = $(`.srow[data-p="${p}"] .sv`) || $(`.strip>div:nth-child(${p+1})`); if (!el) return; flyText((r.game==="match"||r.game==="nassau"||r.game==="alt")?"W":"+"+v, el); });
  toast(`Hole ${h.n} saved`, { label:"Undo", fn:() => { if (prev) r.results[k] = prev; else delete r.results[k]; drafts[k] = clone(res);
    store.saveRound(r.id, { results:{ [k]: prev || DEL }, updatedAt:Date.now(), lastBy:device, lastMsg:`${myName()} undid hole ${h.n}` }); ui.view = i; render({ quiet:true }); } });
  await wait(850);
  if (!live() || ui.tab!=="play") return;
  const c = ENGINE.compute(r);
  if (c.done && !before){ ui.view = i; render({ quiet:true }); celebrate(); return; }
  if (ui.view===i){ const n = nextHole(); if (n!==i || !r.results[String(n)]) { ui.view = n; render({ dir:1 }); } else render({ quiet:true }); }
}
function flyText(t, el){
  const r = el.getBoundingClientRect(), f = document.createElement("div"); f.className = "fly"; f.textContent = t;
  f.style.left = (r.left + r.width/2 - 14) + "px"; f.style.top = (r.top - 4) + "px"; document.body.appendChild(f);
  const a = anim(f, [{ transform:"translateY(0)", opacity:0 }, { transform:"translateY(-14px)", opacity:1, offset:.25 }, { transform:"translateY(-66px)", opacity:0 }], { duration:1000, easing:"steps(12,end)" });
  if (a) a.finished.then(() => f.remove()); else setTimeout(() => f.remove(), 50);
}
const bump = el => anim(el, [{ transform:"scale(1.4)" }, { transform:"scale(1)" }], { duration:360, easing:"steps(4,end)" });

function allGames(){
  const done = history.filter(r => r.status==="done");
  if (!done.length) return `<div class="status">Finished rounds land here. Wins, rounds played and who’s on a heater.</div>`;
  const st = {};
  roster().forEach(p => st[p.id] = { name:p.name, p, played:0, wins:0 });
  done.forEach(r => r.players.forEach(p => { const s = st[p.id] || (st[p.id] = { name:p.name, p, played:0, wins:0 }); s.played++; if ((r.winners||[]).includes(p.id)) s.wins++; }));
  const rows = Object.values(st).filter(s => s.played).sort((a,b) => b.wins-a.wins || (b.wins/b.played)-(a.wins/a.played));
  return `<div class="lbh" style="grid-template-columns:1fr auto auto auto;gap:10px"><span>Player</span><span>Wins</span><span>Played</span><span>Win %</span></div>
  ${rows.map((s,k) => `<div class="stat" ${k===0?'style="color:var(--lime)"':""}><span class="who">${avatar(s.p,"av sm")}${esc(s.name)}</span><em>${s.wins}</em><em class="dim">${s.played}</em><em>${Math.round(s.wins/s.played*100)}%</em></div>`).join("")}

}

    c.fillStyle = "#FFB15A"; const sr = Math.max(3, Math.round(H*.08));

    c.fillStyle = "#101820"; c.fillRect(0, horizon, W, H-horizon);

    c.fillStyle = "#3E6B1F"; for (let x=0;x<W;x++){ const y = Math.round(H*.82 + Math.sin(x*.03 + 2)*2); c.fillRect(x, y, 1, H-y); }

function smooth(pts, closed){ const n = pts.length; let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`; const g = i => closed ? pts[(i+n)%n] : pts[Math.max(0,Math.min(n-1,i))]; const last = closed ? n : n-1;

  fx.classList.add("on"); if (RM){ await wait(1000); fx.classList.remove("on"); return; }
  const cv = $("#streaks"), c = cv.getContext("2d"), P = 4, W = Math.ceil(innerWidth/P), H = Math.ceil(innerHeight/P); cv.width = W; cv.height = H;
  const S2 = Array.from({length:46}, () => ({ x:Math.random()*W*1.5, y:Math.random()*H*1.2-H*.2, l:6+Math.random()*26, v:1.2+Math.random()*2.8, a:.25+Math.random()*.75 }));
  let run = true;
  (function f(){ c.clearRect(0,0,W,H); for (const s of S2){ s.x -= s.v; s.y += s.v*.7; if (s.x<-40||s.y>H+30){ s.x = W+Math.random()*30; s.y = Math.random()*H-H*.3; } c.fillStyle = `rgba(183,255,59,${s.a})`; for (let k=0;k<s.l;k++) c.fillRect(Math.round(s.x+k), Math.round(s.y-k*.7), 1, 1); } if (run) requestAnimationFrame(f); })();
  fx.animate([{ opacity:0 }, { opacity:1 }], { duration:160, fill:"forwards" });
  const art2 = $("#fxart svg"); if (art2) art2.animate([{ transform:"scale(.2) translateY(60px)", opacity:0 }, { transform:"scale(1.15)", opacity:1, offset:.55 }, { transform:"translateX(-4px) scale(1)", offset:.7 }, { transform:"translateX(4px)", offset:.8 }, { transform:"none" }], { duration:620, easing:"steps(10,end)", fill:"forwards" });
  $("#fxh").animate([{ clipPath:"inset(0 100% 0 0)" }, { clipPath:"inset(0 0 0 0)" }], { duration:420, delay:260, easing:"steps(9,end)", fill:"both" });
  $("#fxp").animate([{ opacity:0, transform:"translateY(8px)" }, { opacity:1, transform:"none" }], { duration:300, delay:520, fill:"both" });
  await wait(1900);
  await fx.animate([{ opacity:1 }, { opacity:0 }], { duration:260, fill:"forwards" }).finished;
  run = false; fx.classList.remove("on"); fx.getAnimations().forEach(a => a.cancel()); fx.querySelectorAll("*").forEach(e => e.getAnimations().forEach(a => a.cancel()));
}
function pixelWipe(mid){ return new Promise(res => {
  closeSheet();
  if (RM){ mid(); res(); return; }
  const c = $("#overlay"), P = 10, W = Math.ceil(innerWidth/P), H = Math.ceil(innerHeight/P); c.width = W; c.height = H; const x = c.getContext("2d");
  const cells = [...Array(W*H).keys()]; for (let i=cells.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [cells[i],cells[j]] = [cells[j],cells[i]]; }
  const N = cells.length, dur = 420; let t0 = performance.now(), phase = 0;
  const draw = (a,b,lime) => { for (let i=a;i<b;i++){ const n = cells[i]; x.fillStyle = lime && n%11===0 ? "#B7FF3B" : "#0B0D0E"; x.fillRect(n%W, Math.floor(n/W), 1, 1); } };
  const f = t => { const q = Math.min(1,(t-t0)/dur), k = Math.floor(q*N);
    if (phase===0){ x.clearRect(0,0,W,H); draw(0,k,true); if (q>=1){ x.fillStyle = "#0B0D0E"; x.fillRect(0,0,W,H); mid(); phase = 1; t0 = t+120; } requestAnimationFrame(f); return; }
    if (t < t0){ requestAnimationFrame(f); return; }
    x.clearRect(0,0,W,H); draw(k,N,false); if (q<1) requestAnimationFrame(f); else { x.clearRect(0,0,W,H); res(); } };
  requestAnimationFrame(f);
}); }
function celebrate(force){
  if (!round) return; const key = round.id + ":" + ENGINE.played(round);
  if (!force && localStorage.getItem(LSK.cel)===key) return; localStorage.setItem(LSK.cel, key);
  const c = ENGINE.compute(round);
  toast(c.winners.length ? `${c.winners.map(p=>ENGINE.pname(round,p)).join(" & ")} ${c.winners.length>1?"win":"wins"}!` : "All square. Nobody could split you.");
  if (RM) return;
  const cv = $("#overlay"), P = 4, W = Math.ceil(innerWidth/P), H = Math.ceil(innerHeight/P); cv.width = W; cv.height = H; const x = cv.getContext("2d"), cols = ["#B7FF3B","#F2F2EA","#FF5A3D","#6B6F72"];
  const ps = Array.from({length:140}, () => ({ x:W/2, y:H*.35, vx:(Math.random()-.5)*4, vy:-Math.random()*4-1, c:cols[Math.floor(Math.random()*4)] })), t0 = performance.now();
  (function f(t){ x.clearRect(0,0,W,H); ps.forEach(p => { p.vy += .09; p.x += p.vx; p.y += p.vy; x.fillStyle = p.c; x.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }); if (t-t0 < 3200) requestAnimationFrame(f); else x.clearRect(0,0,W,H); })(t0);
}
function intro(){
  const el = $("#intro"), first = !localStorage.getItem(LSK.me) && localStorage.getItem(LSK.me)!=="";
  const firstTime = localStorage.getItem(LSK.me)===null;
  el.innerHTML = `<canvas class="px" id="introCv"></canvas><div class="brand"><div class="logo">${wolfFull("px logo")}</div>${wordSVG("GOLF GAMES")}<div class="cap tagl">Play / Compete / Good times</div></div>
    ${firstTime ? `<div class="acts"><button class="btn go" id="go">Play</button><button class="btn line" id="watch">Just watching</button></div>` : ""}`;
  scene($("#introCv"), { w:160, h:100, seed:7, anim:true });
  if (!RM){ $$("#intro .logo rect").forEach(r => { const y = +r.getAttribute("y"); r.animate([{ opacity:0 }, { opacity:1 }], { duration:60, delay:100+y*26, fill:"backwards" }); });
    anim($("#intro .word"), [{ clipPath:"inset(0 100% 0 0)" }, { clipPath:"inset(0 0 0 0)" }], { duration:520, delay:800, easing:"steps(14,end)", fill:"backwards" });
    anim($("#intro .tagl"), [{ opacity:0, letterSpacing:".6em" }, { opacity:1, letterSpacing:".28em" }], { duration:600, delay:1200, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards" });
    if (firstTime) $$("#intro .acts .btn").forEach((b,k) => anim(b, [{ opacity:0, transform:"translateY(16px)" }, { opacity:1, transform:"none" }], { duration:450, delay:1350+k*100, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards" })); }
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 550); };
  if (firstTime){ $("#go").onclick = () => { haptic(); close(); setTimeout(askWho, 350); }; $("#watch").onclick = () => { haptic(); me = null; localStorage.setItem(LSK.me, ""); close(); }; }
  else setTimeout(close, RM ? 200 : 2100);
}

/* ---------- actions ---------- */
const ACT = {
  tab: v => { if (v==="play" && !live()){ toast("Start a game first"); if (ui.tab!=="home"||ui.sub) go("home"); return; } haptic(); if (v==="play" && ui.view==null) ui.view = nextHole(); go(v); },
  back: () => { haptic(); if (ui.sub && ui.sub.type==="setup") ui.setup = null; ui.sub = null; render(); },
  setup: v => { haptic(); ui.setup = newSetup(v); go("home", { type:"setup" }); },
  toggleP: v => { const s = ui.setup, k = s.sel.indexOf(v); if (k>=0) s.sel.splice(k,1); else { const g = GAMES[s.game], max = g.sizes ? Math.max(...g.sizes) : g.max; if (s.sel.length >= max){ toast(`${g.name} is ${g.needs.toLowerCase()}`); return; } s.sel.push(v); } haptic(); render({ keepScroll:true }); },
  editP: v => editPlayer(v), addP: () => editPlayer(null),
  shuffle: () => { const s = ui.setup; for (let k=s.sel.length-1;k>0;k--){ const j = Math.floor(Math.random()*(k+1)); [s.sel[k],s.sel[j]] = [s.sel[j],s.sel[k]]; } haptic(); render({ keepScroll:true }); toast(s.game==="wolf" ? `${rosterBy(s.sel[0]).name} is the wolf first` : "Pairs shuffled"); },
  club: v => { const [id,cl] = v.split("|"), s = ui.setup, list = s.clubs[id] = (s.clubs[id]||[]).slice(), k = list.indexOf(cl); if (k>=0) list.splice(k,1); else { if (list.length>=3){ toast("Three clubs only, plus the putter"); return; } list.push(cl); } haptic(); render({ keepScroll:true }); },
  pickCourse: () => pickCourse(c => { ui.setup.courseId = c.id; closeSheet(); render({ keepScroll:true }); }),
  mode: v => { ui.setup.holesMode = v; haptic(); render({ keepScroll:true }); },
  optN: v => { const [k,d] = v.split("|"), s = ui.setup.settings; s[k] = Math.max(0, Math.min(k==="value"||k==="stake"?500:20, (+s[k]||0) + (+d)*(k==="value"||k==="stake"?5:1))); haptic(); render({ keepScroll:true }); },
  start: () => { haptic(); startGame(); },
  hole: v => { const j = +v; if (j===ui.view) return; haptic(); const dir = j>ui.view?1:-1; ui.view = j; render({ dir }); },
  partner: v => { const d = holeDraft(ui.view), p = +v; if (d.mode==="partner" && d.partner===p){ d.mode = null; d.partner = null; } else { d.mode = "partner"; d.partner = p; } haptic(); syncPlay(); },
  lone: v => { const d = holeDraft(ui.view); if (d.mode===v){ d.mode = null; syncPlay(); return; } d.mode = v; d.partner = null; haptic(); syncPlay(); const S = round.settings, w = ENGINE.pname(round, d.wolf);
    takeover(v==="blind"?"Blind wolf":"Lone wolf", v==="blind" ? `${w} calls it before anyone tees off. Win ${S.blindWin}, or each hunter takes ${S.blindLoss}.` : `${w} hunts alone. Win ${S.loneWin}, or each hunter takes ${S.loneLoss}.`, wolfFull("px big")); },
  inc: v => { const d = holeDraft(ui.view), p = +v; d.s[p] = Math.min(15, d.s[p]+1); haptic(); syncPlay(); bump($(`.srow[data-p="${p}"] .sv b`)); },
  dec: v => { const d = holeDraft(ui.view), p = +v; d.s[p] = Math.max(1, d.s[p]-1); haptic(); syncPlay(); bump($(`.srow[data-p="${p}"] .sv b`)); },
  tinc: v => { const d = holeDraft(ui.view), k = +v; d.t[k] = Math.min(15, d.t[k]+1); haptic(); syncPlay(); bump($(`.srow[data-t="${k}"] .sv b`)); },
  tdec: v => { const d = holeDraft(ui.view), k = +v; d.t[k] = Math.max(1, d.t[k]-1); haptic(); syncPlay(); bump($(`.srow[data-t="${k}"] .sv b`)); },
  pickS: v => { haptic(); pickScore(+v, false); }, pickT: v => { haptic(); pickScore(+v, true); },
  bbb: v => { const [j,p] = v.split("|").map(Number), d = holeDraft(ui.view); d.b[j] = d.b[j]===p ? -1 : p; haptic(); syncPlay(); },
  finish: () => { haptic(); finishRound(); },
  btab: v => { ui.boardTab = v; haptic(); render({ keepScroll:true }); },
  scorecard: v => { haptic(); go(ui.tab, { type:"card", id:v }); },
  share: async () => { haptic(); const r = live() ? round : (round && round.status==="done") ? round : history.find(x => x.status==="done"); if (!r) return; const text = shareText(r);
    try { if (navigator.share){ await navigator.share({ text }); return; } } catch(e){ if (e && e.name==="AbortError") return; }
    try { await navigator.clipboard.writeText(text); toast("Copied, paste it in the chat"); } catch(e){ toast("Couldn’t share on this browser"); } },
  who: () => askWho(), players: () => openSheet(`<h3>Players</h3><p>Tap someone to change their name or handicap.</p>${roster().map(p=>`<button class="mi" data-pp="${p.id}"><span style="display:flex;align-items:center;gap:12px">${avatar(p,"av sm")}${esc(p.name)}</span><span class="dim">Hcp ${+p.hcp||0}</span></button>`).join("")}<button class="btn line" id="padd" style="margin-top:14px">${ic("plus")}Add player</button>`,
    sh => { sh.querySelectorAll("[data-pp]").forEach(b => b.onclick = () => editPlayer(b.dataset.pp)); sh.querySelector("#padd").onclick = () => editPlayer(null); }),
  courses: () => pickCourse(null, true), rulesAll: () => rulesSheet(),
  restart: () => holdSheet("Clear the scores?", `Wipes every hole saved in this ${GAMES[round.game].name} round on all phones. Players, course and options stay.`, "Hold to clear scores", restartRound),

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName==="INPUT") return;
  const f = ACT[b.dataset.a]; if (!f) return;
  if (b.disabled) return; f(b.dataset.v, b, e);
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset || !t.dataset.a) return;
  if (t.dataset.a==="hcp"){ ui.setup.useHcp = t.checked; haptic(); render({ keepScroll:true }); }
  else if (t.dataset.a==="optB"){ ui.setup.settings[t.dataset.v] = t.checked; haptic(); }

$("#save").addEventListener("click", () => { const s = $("#save"); if (!s.disabled && !s.querySelector("svg")) saveHole(); });
$("#scrim").addEventListener("click", closeSheet);
let sx = 0, sy = 0, s0 = 0;
$("#screen").addEventListener("touchstart", e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; s0 = Date.now(); }, { passive:true });
$("#screen").addEventListener("touchend", e => { if (ui.tab!=="play" || ui.sub || !live() || e.target.closest(".track")) return; const t = e.changedTouches[0], dx = t.clientX-sx, dy = t.clientY-sy;

let lock = null;
async function keepAwake(){ try { if (localStorage.getItem(LSK.awake)==="off"){ if (lock){ await lock.release(); lock = null; } return; } if ("wakeLock" in navigator && !lock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch(e){} }
document.addEventListener("visibilitychange", keepAwake); document.addEventListener("click", keepAwake, { once:true });

/* ---------- boot ---------- */
async function boot(){
  intro();
  const cloud = firebaseConfig.projectId && firebaseConfig.projectId!=="PASTE_HERE" && !window.__GG_LOCAL;
  if (cloud){ try { store = await CloudStore(firebaseConfig); } catch(e){ console.error(e); store = null; } }
  if (!store){ store = LocalStore(); if (cloud) toast("Offline. Scores save on this phone for now."); }
  store.onStatus(setSync); setSync(store.kind==="local" ? "local" : "offline");
  store.watchMeta(onMeta); store.watchHistory(onHistory);
}
boot();
window.__gg = { get state(){ return { meta, round, history, ui, drafts, me, store: store && store.kind }; }, ENGINE };
