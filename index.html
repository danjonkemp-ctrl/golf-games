<title>Wolf. Golf, compete, conquer.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#0B0D0E; --slate:#2B2F33; --stone:#6B6F72; --lime:#B7FF3B; --bone:#F2F2EA;
  --card:#131619; --card2:#1B1F22; --line:rgba(242,242,234,.08); --glass:rgba(11,13,14,.8);
  --pixel:"Silkscreen","Courier New",monospace;
  --num:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--midnight)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--midnight);color:var(--bone);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
svg.px{shape-rendering:crispEdges;display:block}
.cap{font:600 11px/1 var(--body);letter-spacing:.32em;text-transform:uppercase}
.pxf{font-family:var(--pixel)}

/* top + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:0 8px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.top .mid{text-align:center;line-height:1.15}
.top .mid b{display:block;font:700 17px var(--body)}
.top .mid span{font-size:12px;color:var(--stone);font-weight:600}
.top .l{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px}
.top .l svg{width:22px;height:22px}
.top .r{justify-self:end;display:flex;align-items:center;justify-content:center;width:44px;height:44px}
.dot{width:9px;height:9px;background:var(--stone)}
.dot.live{background:var(--lime);animation:blink 2.4s steps(2) infinite}
.dot.pending{background:var(--bone)} .dot.offline,.dot.setup{background:#FF6B4A}
@keyframes blink{50%{opacity:.35}}
main{max-width:520px;margin:0 auto;padding:0 18px 240px;min-height:100vh}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px env(safe-area-inset-bottom,0px);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0 8px;font-size:10.5px;font-weight:600;color:var(--stone);transition:color .2s}
.nav svg{width:22px;height:22px;transition:transform .35s var(--spring)}
.nav button[aria-selected="true"]{color:var(--lime)}
.nav button[aria-selected="true"] svg{transform:translateY(-2px) scale(1.12)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:12px;font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;transition:transform .25s var(--spring),opacity .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn.lime{background:var(--lime);color:var(--midnight);box-shadow:0 0 0 0 rgba(183,255,59,.0),0 10px 30px -12px rgba(183,255,59,.55)}
.btn.ghost{border:1.5px solid rgba(242,242,234,.35);color:var(--bone)}
.btn:disabled{opacity:.3}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:7px;background:var(--lime);color:var(--midnight);font:700 11px var(--body)}
.chip.dim{background:var(--card2);color:var(--stone)}

/* intro */
.intro{position:fixed;inset:0;z-index:80;background:var(--midnight);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}
.intro .scene{position:absolute;left:0;right:0;bottom:0;height:52%;width:100%;image-rendering:pixelated}
.intro .scene::after{content:""}
.intro .fade{position:absolute;left:0;right:0;bottom:52%;height:90px;transform:translateY(100%);background:linear-gradient(var(--midnight),transparent)}
.intro .brand{position:relative;margin-top:calc(env(safe-area-inset-top,0px) + 13vh);display:flex;flex-direction:column;align-items:center}
.intro .logo{width:132px;height:127px}
.intro .word{width:230px;height:auto;margin-top:22px}
.intro .tag{margin-top:18px;color:var(--bone);font-size:10.5px}
.intro .acts{position:absolute;left:24px;right:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:440px;margin:0 auto}
.intro.out{animation:introOut .55s var(--ease) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}

/* home */
.hello{margin:18px 0 18px}
.hello h1{margin:0;font:700 26px/1.15 var(--body)}
.hello p{margin:4px 0 0;color:var(--stone);font-weight:500}
.round{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:16px;border:1px solid rgba(242,242,234,.14);background:linear-gradient(120deg,rgba(183,255,59,.07),transparent 55%),var(--card);transition:transform .25s var(--spring)}
.round:active{transform:scale(.98)}
.round .ic{width:46px;height:46px;flex:none}
.round b{display:block;font-size:17px}
.round small{display:block;color:var(--stone);font-weight:500;font-size:13px;margin-top:2px}
.round .go{margin-left:auto;width:20px;height:20px;color:var(--bone)}
.tabs{display:flex;gap:26px;margin:28px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 12px;color:var(--stone);position:relative}
.tabs button[aria-selected="true"]{color:var(--lime)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--lime)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:14px;height:62px;padding:0 14px;border-bottom:1px solid var(--line);border-radius:0;position:relative}
.lb li.hl{border:1.5px solid var(--lime);border-radius:12px;background:rgba(183,255,59,.08);margin:4px 0}
.lb .n{width:14px;font:700 14px var(--num);color:var(--stone)}
.lb li.hl .n{color:var(--lime)}
.lb .nm{flex:1;font-weight:600;font-size:15px}
.lb .nm small{display:block;font-size:12px;color:var(--stone);font-weight:500}
.lb .sc{font:800 20px var(--num);min-width:44px;text-align:right}
.lb .sc small{display:block;font:600 10px var(--body);color:var(--stone);letter-spacing:.06em}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.game{position:relative;padding:16px 14px;border-radius:14px;background:var(--card);min-height:122px;display:flex;flex-direction:column;gap:10px;text-align:left}
.game svg{width:30px;height:30px}
.game b{font-size:15px}
.game small{color:var(--stone);font-size:12px;line-height:1.35}
.game .chip{position:absolute;top:12px;right:12px;height:22px;font-size:10px}
.game.soon{opacity:.62}
.sect{margin:30px 0 10px;color:var(--stone)}

/* avatars */
.av{--c:var(--stone);flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--slate);box-shadow:inset 0 0 0 1.5px var(--c);font:700 15px var(--body);color:var(--bone);position:relative}
.av.lime{--c:var(--lime);color:var(--lime)}
.av svg{width:26px;height:26px}

/* hole */
.map{position:relative;margin:4px -18px 0;height:212px;overflow:hidden}
.map canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.map::after{content:"";position:absolute;inset:auto 0 0;height:70px;background:linear-gradient(transparent,var(--midnight))}
.map .yd{position:absolute;left:18px;top:14px;z-index:2;display:flex;gap:6px}
.track{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:-22px 0 16px;position:relative;z-index:3}
.track button{height:34px;border-radius:8px;background:var(--card2);font:700 12px/34px var(--num);color:var(--stone);transition:transform .3s var(--spring),background .2s,color .2s}
.track button.done{color:var(--lime);background:rgba(183,255,59,.1)}
.track button.cur{background:var(--lime);color:var(--midnight);transform:translateY(-3px)}
.track button:active{transform:scale(.9)}
.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph b{font-size:17px}
.pack{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:14px;transition:transform .3s var(--spring),background .2s}
.pk .av{width:48px;height:48px}
.pk span{font-size:12px;font-weight:600}
.pk small{font:700 9px var(--body);letter-spacing:.14em;color:var(--stone);margin-top:-3px}
.pk.wolf{background:rgba(183,255,59,.07);box-shadow:inset 0 0 0 1px rgba(183,255,59,.28)}
.pk.wolf small{color:var(--lime)}
.pk[aria-pressed="true"]{background:rgba(183,255,59,.12);box-shadow:inset 0 0 0 1.5px var(--lime)}
.pk[aria-pressed="true"] .av{--c:var(--lime);transform:scale(1.06)}
.pk:active{transform:scale(.93)}
.alone{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.alone button{height:50px;border-radius:12px;border:1.5px solid rgba(242,242,234,.22);font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;transition:transform .25s var(--spring),background .2s,color .2s,border-color .2s}
.alone button[aria-pressed="true"]{background:var(--lime);color:var(--midnight);border-color:var(--lime)}
.alone button:active{transform:scale(.95)}
.hint{color:var(--stone);font-size:13px;margin:12px 2px 0}
.hint:empty{display:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 0}
.row+.row{border-top:1px solid var(--line)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:15px}
.tag{display:inline-block;margin-top:3px;font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.tag.w{color:var(--lime)} .tag.p{color:var(--bone)}
.tag:empty{display:none}
.stp{display:flex;align-items:center;gap:4px}
.stp .pm{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;transition:transform .2s var(--spring)}
.stp .pm svg{width:14px;height:14px}
.stp .pm:active{transform:scale(.85)}
.sv{width:56px;text-align:center}
.sv b{display:block;font:800 30px/1 var(--num);font-variant-numeric:tabular-nums}
.sv span{display:block;font:700 9px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-top:4px;height:11px}
.sv.under b,.sv.under span{color:var(--lime)}
.dock{position:fixed;left:0;right:0;z-index:24;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding:0 12px;pointer-events:none;transition:transform .45s var(--ease),opacity .3s}
.dock.away{transform:translateY(160%);opacity:0}
.dockin{max-width:500px;margin:0 auto;pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:rgba(27,31,34,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(242,242,234,.1);box-shadow:0 20px 40px -14px #000}
.verdict{flex:1;min-width:0;font-size:13px;color:var(--stone);line-height:1.3}
.verdict b{display:block;color:var(--bone);font-size:15px}
.save{flex:none;height:50px;min-width:50px;padding:0 18px;border-radius:12px;background:var(--lime);color:var(--midnight);font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;display:grid;place-items:center;transition:transform .25s var(--spring),opacity .2s,padding .3s var(--ease)}
.save:disabled{opacity:.25}
.save:not(:disabled):active{transform:scale(.93)}
.save.ok{padding:0;width:50px}
.save svg{width:22px;height:22px}
.fly{position:fixed;z-index:40;pointer-events:none;font:700 28px var(--pixel);color:var(--lime);text-shadow:0 0 18px rgba(183,255,59,.6)}

/* takeover */
.fx{position:fixed;inset:0;z-index:60;background:var(--midnight);visibility:hidden;pointer-events:none;overflow:hidden}
.fx.on{visibility:visible;pointer-events:auto}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.fx .logo{width:180px;height:173px}
.fx h2{margin:26px 0 0;font:700 clamp(40px,13vw,64px)/1 var(--pixel);color:var(--lime);text-shadow:0 0 30px rgba(183,255,59,.35)}
.fx p{margin:14px auto 0;max-width:290px;font-weight:600;color:var(--bone)}

/* table */
.h1{margin:20px 0 4px;font:700 26px var(--body)}
.sub{color:var(--stone);margin:0;font-weight:500}
.grid{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:460px;font-size:13px}
th,td{padding:9px 2px;text-align:center}
th{font:700 11px var(--num);color:var(--stone)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;padding-left:2px;font-family:var(--body)}
td .c{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font:700 13px var(--num)}
td .c.w{box-shadow:inset 0 0 0 1.5px var(--bone)}
td .c.pt{background:var(--lime);color:var(--midnight)}
.legend{font-size:12px;color:var(--stone);margin:10px 0 0}

/* setup */
.lbl{display:block;font:700 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--stone);margin:0 0 7px}
.field{width:100%;height:48px;font:600 16px var(--body);padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--bone)}
.field:focus{border-color:var(--lime);outline:none}
.pset{display:grid;grid-template-columns:40px 1fr 80px;gap:10px;align-items:end;margin-bottom:12px}
.ord{display:flex;align-items:center;gap:12px;padding:9px 0}
.ord+.ord{border-top:1px solid var(--line)}
.ord .nm{flex:1;font-weight:600}
.ord .nm small{display:block;font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.sm{width:40px;height:40px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.sm:disabled{opacity:.25}
.sm svg{width:12px;height:12px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-weight:600}
.tg+.tg{border-top:1px solid var(--line)}
.tg small{display:block;font-weight:500;font-size:12px;color:var(--stone)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:8px;background:var(--slate);position:relative;cursor:pointer;margin:0;transition:background .2s}

function scene(cv){
  const W=160,H=90;cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const r=rng(5);const sky=["#0B0D0E","#101315","#16191C","#1E2124","#2B2F33"];
  for(let y=0;y<H*.55;y++){const t=y/(H*.55)*(sky.length-1),a=Math.floor(t),f=t-a;for(let x=0;x<W;x++){const thr=((x%2)+(y%2)*2)/4;c.fillStyle=sky[Math.min(sky.length-1,a+(f>thr?1:0))];c.fillRect(x,y,1,1)}}
  for(let k=0;k<26;k++){c.fillStyle=r()<.2?"#B7FF3B":"#6B6F72";c.fillRect(Math.floor(r()*W),Math.floor(r()*H*.4),1,1)}
  const ridge=(base,amp,freq,col,seed)=>{const q=rng(seed);const ph=q()*6;c.fillStyle=col;for(let x=0;x<W;x++){const y=Math.round(base+Math.sin(x*freq+ph)*amp+Math.sin(x*freq*2.7+ph)*amp*.4);c.fillRect(x,y,1,H-y)}};
  ridge(H*.5,4,.05,"#2B2F33",1);ridge(H*.6,5,.035,"#1C1F22",2);ridge(H*.72,6,.03,"#131619",3);
  c.fillStyle="#1B2416";for(let x=0;x<W;x++){const y=Math.round(H*.8+Math.sin(x*.025+1)*3);c.fillRect(x,y,1,H-y)}
  const fx=112,fy=Math.round(H*.8+Math.sin(fx*.025+1)*3);c.fillStyle="#F2F2EA";c.fillRect(fx,fy-12,1,12);c.fillStyle="#B7FF3B";c.fillRect(fx+1,fy-12,4,1);c.fillRect(fx+1,fy-11,6,1);c.fillRect(fx+1,fy-10,4,1);
  const gx=52,gy=Math.round(H*.72+Math.sin(gx*.03+rng(3)()*6)*6);c.fillStyle="#0B0D0E";[[1,0,2],[0,2,4],[1,6,2],[1,8,1],[2,8,1]].forEach(([x,y,h])=>c.fillRect(gx+x,gy-10+y,2,h));c.fillRect(gx+3,gy-6,1,6);
}

    anim($(".intro .word"),[{clipPath:"inset(0 100% 0 0)"},{clipPath:"inset(0 0 0 0)"}],{duration:500,delay:850,easing:"steps(12,end)",fill:"backwards"});
    anim($(".intro .tag"),[{opacity:0,letterSpacing:".6em"},{opacity:1,letterSpacing:".32em"}],{duration:600,delay:1250,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"});
    anim($("#scene"),[{opacity:0,transform:"translateY(20px)"},{opacity:1,transform:"none"}],{duration:900,delay:300,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"});
    if(first)$$(".acts .btn").forEach((b,k)=>anim(b,[{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:450,delay:1400+k*100,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"}))}
  const close=()=>{el.classList.add("out");setTimeout(()=>el.remove(),600)};
  if(first){$("#go").onclick=()=>{haptic();close();setTimeout(askWho,350)};$("#watch").onclick=()=>{haptic();me=null;localStorage.setItem(ME,"-1");close()}}
  else setTimeout(close,RM?300:2300);
}

/* ---------- celebration ---------- */
function celebrate(){
  if(localStorage.getItem(CEL)===st.roundId)return;localStorage.setItem(CEL,st.roundId);
  const top=standings()[0];toast(`${name(top.p)} is top dog with ${top.pts} pts`);if(RM)return;
  const c=$("#confetti"),P=4,W=Math.ceil(innerWidth/P),H=Math.ceil(innerHeight/P);c.width=W;c.height=H;const x=c.getContext("2d"),cols=["#B7FF3B","#F2F2EA","#6B6F72"];
  const ps=Array.from({length:120},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*4,vy:-Math.random()*4-1,c:cols[Math.floor(Math.random()*3)]}));const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.09;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),1,1)});if(t-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})(t0);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-nav],[data-tab]");if(!b)return;const t=b.dataset.nav||b.dataset.tab;if(t===tab)return;haptic();if(t==="table"&&b.dataset.nav)tableTab="holes";setTab(t)});
$("#save").addEventListener("click",()=>{const s=$("#save");if(!s.disabled&&!s.classList.contains("ok"))saveHole()});
$("#screen").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||b.dataset.nav)return;
  if(tab==="play"){const i=view,d=draftFor(i),w=wolfFor(i);
    if(b.dataset.go!==undefined){const j=+b.dataset.go;if(j===view)return;haptic();const dir=j>view?1:-1;view=j;renderPlay(dir);return}
    if(b.dataset.partner!==undefined){const p=+b.dataset.partner;if(d.mode==="partner"&&d.partner===p){d.mode=null;d.partner=null}else{d.mode="partner";d.partner=p}haptic();syncPlay();return}
    if(b.dataset.mode){const m=b.dataset.mode;if(d.mode===m){d.mode=null;syncPlay();return}d.mode=m;d.partner=null;haptic();syncPlay();takeover(m,w);return}
    if(b.dataset.inc!==undefined){const p=+b.dataset.inc;d.scores[p]=Math.min(15,d.scores[p]+1);haptic();syncPlay();bump($(`.row[data-row="${p}"] .sv b`));return}
    if(b.dataset.dec!==undefined){const p=+b.dataset.dec;d.scores[p]=Math.max(1,d.scores[p]-1);haptic();syncPlay();bump($(`.row[data-row="${p}"] .sv b`));return}
    if(b.dataset.pick!==undefined){haptic();pickScore(+b.dataset.pick);return}}
  if(tab==="table"){if(b.dataset.tt){tableTab=b.dataset.tt;haptic();renderTable();return}
    if(b.id==="share"){haptic();const text=shareText();try{if(navigator.share){await navigator.share({text});return}}catch(err){if(err&&err.name==="AbortError")return}
      try{await navigator.clipboard.writeText(text);toast("Copied, paste it in the chat")}catch(err){toast("Couldn’t share on this browser")}return}}
  if(tab==="setup"){
    if(b.dataset.up!==undefined||b.dataset.down!==undefined){const k=+(b.dataset.up??b.dataset.down),j=b.dataset.up!==undefined?k-1:k+1,r=ordRects();[st.order[k],st.order[j]]=[st.order[j],st.order[k]];haptic();persist("",{order:st.order});renderSetup(r);return}
    if(b.id==="throw"){const r=ordRects(),o=st.order.slice();for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[o[k],o[j]]=[o[j],o[k]]}st.order=o;haptic();persist(`${name(o[0])} is the wolf on 10`,{order:o});renderSetup(r);toast(`${name(o[0])} is the wolf on 10`);return}
    if(b.id==="whoami"){askWho();return}
    if(b.id==="reset"){openSheet(`<h3>Start a new round?</h3><p>This clears every score on all four phones. Names, order and points stay.</p><button class="btn lime" id="doreset">Clear scores</button><button class="linkbtn" id="noreset">Keep this round</button>`,
      sh=>{sh.querySelector("#noreset").onclick=closeSheet;sh.querySelector("#doreset").onclick=()=>{st=fresh(st);drafts={};view=0;persist("New round started",null,true);closeSheet();toast("New round started");setTab("home")}});return}}
});
$("#screen").addEventListener("change",e=>{
  const t=e.target,S=st.settings,cl=(v,a,b,d)=>Math.max(a,Math.min(b,Math.round(isNaN(+v)||v===""?d:+v)));
  if(t.dataset.name!==undefined){const p=+t.dataset.name;st.players[p]=t.value.trim().slice(0,14)||"Player "+(p+1);persist("",{players:st.players});renderSetup()}
  else if(t.dataset.strokes!==undefined){st.strokes[+t.dataset.strokes]=cl(t.value,0,18,0);persist("",{strokes:st.strokes})}
  else if(t.dataset.set!==undefined){S[t.dataset.set]=cl(t.value,0,20,0);persist("",{settings:{[t.dataset.set]:S[t.dataset.set]}})}
  else if(t.dataset.par!==undefined){const i=+t.dataset.par;st.holes[i].par=cl(t.value,3,6,4);delete drafts[key(i)];persist("",{holes:st.holes})}
  else if(t.dataset.si!==undefined){st.holes[+t.dataset.si].si=cl(t.value,1,18,1);persist("",{holes:st.holes})}
  else if(t.id==="lastwolf"){S.lastWolf18=t.checked;haptic();persist("",{settings:{lastWolf18:t.checked}})}
  else if(t.id==="awake"){S.awake=t.checked;haptic();persist("",{settings:{awake:t.checked}});keepAwake()}
  else return;toast("Saved");
});
let sx=0,sy=0,s0=0;
$("#screen").addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;s0=Date.now()},{passive:true});
$("#screen").addEventListener("touchend",e=>{if(tab!=="play")return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-s0<600){const j=view+(dx<0?1:-1);if(j<0||j>8)return;haptic();view=j;renderPlay(dx<0?1:-1)}},{passive:true});
let lock=null;
async function keepAwake(){try{if(st.settings.awake===false){if(lock){await lock.release();lock=null}return}if("wakeLock" in navigator&&!lock&&document.visibilityState==="visible"){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null})}}catch(e){}}
document.addEventListener("visibilitychange",keepAwake);document.addEventListener("click",keepAwake,{once:true});

/* ---------- boot ---------- */
setTab("home");intro();
(async()=>{
  if(firebaseConfig.projectId==="PASTE_HERE"){setSync("setup");return}
  try{
    const[{initializeApp},F]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-firestore.js")]);
    const app=initializeApp(firebaseConfig),db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}),ref=F.doc(db,"rounds","current");
    fb={ref,setDoc:F.setDoc,del:F.deleteField};
    F.onSnapshot(ref,{includeMetadataChanges:true},snap=>{
      setSync(snap.metadata.hasPendingWrites?"pending":snap.metadata.fromCache?"offline":"live");
      if(!snap.exists()){if(!snap.metadata.fromCache)F.setDoc(ref,JSON.parse(JSON.stringify({...st,lastBy:device,lastMsg:""}))).catch(console.error);return}
      const d=snap.data();if(!valid(d))return;
      const remote=d.lastBy&&d.lastBy!==device&&!snap.metadata.hasPendingWrites&&(d.updatedAt||0)>lastSeen,changedRound=d.roundId!==st.roundId,before=played(),{lastBy,lastMsg,...clean}=d;
      if(stable(clean)===stable(st)){lastSeen=Math.max(lastSeen,d.updatedAt||0);return}
      st=JSON.parse(JSON.stringify(clean));saveLocal();if(changedRound){drafts={};view=null}
      for(const k of Object.keys(drafts))if(st.results[k])delete drafts[k];
      if(remote&&lastSeen&&lastMsg)toast(lastMsg);lastSeen=Math.max(lastSeen,d.updatedAt||0);
      if(before<9&&played()>=9)celebrate();
      const a=document.activeElement;if((a&&a.tagName==="INPUT")||$("#sheet").classList.contains("on"))return;
      if(tab==="play"){if(view===null)view=nextHole();renderPlay(0,false)}else setTab(tab);
    },err=>{console.error(err);setSync("offline");toast("Can’t reach the scores ("+(err.code||"error")+")")});
  }catch(e){console.error(e);setSync("offline")}
})();
</script>
